packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@void/md": 1.8.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  void: ^1.8.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@nkzw/fate@2.2.2"
  - react-fate@2.2.2
  - void-fate@2.2.2
