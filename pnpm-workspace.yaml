packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.13
  "@types/node": ^24
  "@ui-sdk/core": 0.1.0-beta.13
  "@ui-sdk/react": 0.1.0-beta.13
  "@void/md": 1.8.0
  cf: 1.0.0-beta.31
  jsdom: ^31.0.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  void: ^1.8.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
