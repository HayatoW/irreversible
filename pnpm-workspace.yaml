packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26
  typescript: ^7
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
onlyBuiltDependencies:
  - esbuild
  - lightningcss
