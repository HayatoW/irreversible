name: Deploy Reading Room

on:
  push:
    branches: [main]
    paths:
      - apps/reading-room/**
      - apps/blog/pages/posts/**
      - .github/workflows/deploy-reading-room.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency: reading-room-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Build Reading Room
        run: vp run reading-room#build
      - name: Deploy Reading Room to Cloudflare
        working-directory: apps/reading-room
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: irreversible
        run: vp run deploy --dir dist --spa
