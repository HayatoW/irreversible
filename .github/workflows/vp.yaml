# https://viteplus.dev/guide/ci#github-actions
name: Vite+ CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test
      - run: vp build
