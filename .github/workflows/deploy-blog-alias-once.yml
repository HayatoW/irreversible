name: Publish the blog workers.dev alias

on:
  push:
    branches: [blog]
    paths: [.github/workflows/deploy-blog-alias-once.yml]

permissions:
  contents: read

concurrency: irreversible-blog-deploy

jobs:
  deploy-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish only the new blog Worker
        working-directory: apps/blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const { resolved: lock } = JSON.parse(readFileSync("void.lock.json", "utf8"));
          if (!token || lock.name !== "irreversible-blog" || !/^[a-f0-9]{32}$/.test(lock.account_id)) {
            throw new Error("Expected the existing blog deployment lock and a Cloudflare token.");
          }
          async function request(path, method = "GET", payload) {
            const multipart = payload instanceof FormData;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${lock.account_id}${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                ...(!multipart && payload ? { "Content-Type": "application/json" } : {}),
              },
              body: multipart ? payload : payload && JSON.stringify(payload),
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              const codes = (body.errors ?? []).map(({ code }) => code).filter(Number.isInteger);
              throw new Error(`Cloudflare ${method} ${path}: HTTP ${response.status}, codes: ${codes.join(", ")}`);
            }
            return body;
          }
          const { result: accountSubdomain } = await request("/workers/subdomain");
          if (accountSubdomain?.subdomain !== "irreversible") {
            throw new Error("Cloudflare account does not match the requested workers.dev domain.");
          }
          const names = new Set();
          for (let page = 1; ; page++) {
            const { result, result_info } = await request(`/workers/scripts?page=${page}&per_page=100`);
            if (!Array.isArray(result)) throw new Error("Could not verify existing Workers.");
            for (const { id } of result) names.add(id);
            if (page >= (result_info?.total_pages ?? 1)) break;
          }
          if (names.has("blog") || !names.has("irreversible") || !names.has(lock.name)) {
            throw new Error("Expected the current site and blog Workers, and no Worker already named blog.");
          }

          const form = new FormData();
          const metadata = {
            main_module: "worker.js",
            compatibility_date: "2025-12-01",
            bindings: [{ name: "BLOG", type: "service", service: lock.name }],
          };
          form.set("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
          form.set("worker.js", new Blob([readFileSync("alias/worker.js")], {
            type: "application/javascript+module",
          }), "worker.js");
          await request("/workers/scripts/blog", "PUT", form);
          const { result } = await request("/workers/scripts/blog/subdomain", "POST", {
            enabled: true, previews_enabled: false,
          });
          if (result?.enabled !== true) throw new Error("Cloudflare did not enable the blog workers.dev route.");
          console.log("Blog alias: https://blog.irreversible.workers.dev");
          NODE
