name: Deploy blog directly

on:
  push:
    branches: [devin/deploy-direct-blog-558b025]
    paths: [.github/workflows/deploy-blog-once.yml]

permissions:
  contents: read

concurrency: irreversible-blog-deploy

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp run build
      - name: Verify the target and capture the current production versions
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync(".void-wrangler.jsonc", "utf8"));
          assert.deepEqual(config, JSON.parse(readFileSync("void.lock.json", "utf8")).resolved);
          assert.equal(config.account_id, "1c5b61e0bfd3a45c3b3c10207fb6136d");
          assert.equal(config.name, "blog");
          assert.equal(config.workers_dev, true);
          assert.equal(config.preview_urls, false);
          for (const key of ["routes", "route", "migrations", "d1_databases", "durable_objects", "services"]) {
            assert.equal(config[key], undefined, `Unexpected config key: ${key}`);
          }
          assert.deepEqual(config.kv_namespaces, [{ binding: "ISR_CACHE", id: "a31ed920b7464ba8ad0d478cfde962e9" }]);
          const token = process.env.CLOUDFLARE_API_TOKEN;
          assert(token, "The repository Cloudflare secret is unavailable");
          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${config.account_id}/workers/scripts/${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            });
            assert(response.ok, `Cloudflare read of ${path} failed: HTTP ${response.status}`);
            const payload = await response.json();
            assert(payload.success, `Cloudflare rejected ${path}`);
            return payload.result;
          }
          async function active(name) {
            const { deployments } = await get(`${name}/deployments`);
            const deployment = deployments.toSorted((a, b) => Date.parse(b.created_on) - Date.parse(a.created_on))[0];
            assert.equal(deployment?.versions?.length, 1, `Expected one active version for ${name}`);
            assert.equal(deployment.versions[0].percentage, 100);
            return deployment.versions[0].version_id;
          }
          const [blog, website, old] = await Promise.all(["blog", "irreversible", "irreversible-blog"].map(active));
          const { resources } = await get(`blog/versions/${blog}`);
          const services = resources.bindings.filter(({ type }) => type === "service");
          assert(services.length === 1 && services[0].name === "BLOG" && services[0].service === "irreversible-blog",
            "The live blog Worker is not the expected forwarding Worker");
          console.log(`Previous blog version (rollback): ${blog}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `account=${config.account_id}\nblog=${blog}\nwebsite=${website}\nold=${old}\n`);
          NODE
      - name: Deploy only the blog Worker through Void
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.baseline.outputs.account }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec void deploy --platform cloudflare
      - name: Verify the live blog no longer forwards requests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.baseline.outputs.account }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BASELINE_BLOG: ${{ steps.baseline.outputs.blog }}
          BASELINE_WEBSITE: ${{ steps.baseline.outputs.website }}
          BASELINE_OLD: ${{ steps.baseline.outputs.old }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token } = process.env;
          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            });
            assert(response.ok, `Cloudflare read of ${path} failed: HTTP ${response.status}`);
            const payload = await response.json();
            assert(payload.success, `Cloudflare rejected ${path}`);
            return payload.result;
          }
          async function active(name) {
            const { deployments } = await get(`${name}/deployments`);
            const deployment = deployments.toSorted((a, b) => Date.parse(b.created_on) - Date.parse(a.created_on))[0];
            assert.equal(deployment?.versions?.length, 1, `Expected one active version for ${name}`);
            assert.equal(deployment.versions[0].percentage, 100);
            return deployment.versions[0].version_id;
          }
          const [blog, website, old] = await Promise.all(["blog", "irreversible", "irreversible-blog"].map(active));
          assert.notEqual(blog, process.env.BASELINE_BLOG);
          assert.equal(website, process.env.BASELINE_WEBSITE);
          assert.equal(old, process.env.BASELINE_OLD);
          const { resources } = await get(`blog/versions/${blog}`);
          assert(!resources.bindings.some(({ type }) => type === "service"), "The live blog still has a service binding");
          assert(resources.bindings.some(({ type, name, namespace_id }) =>
            type === "kv_namespace" && name === "ISR_CACHE" && namespace_id === "a31ed920b7464ba8ad0d478cfde962e9"));
          console.log(`Direct blog version: ${blog}; portfolio and old blog versions unchanged.`);
          NODE
      - name: Save the deployed configuration
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blog-void-lock
          path: apps/blog/void.lock.json
          retention-days: 7
