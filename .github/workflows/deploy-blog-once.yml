name: Redeploy the blog favicon removal

on:
  push:
    branches: [devin/redeploy-blog-f81cda1]
    paths: [.github/workflows/deploy-blog-once.yml]

permissions:
  contents: read

concurrency: irreversible-blog-deploy

jobs:
  deploy-blog:
    if: ${{ !contains(github.event.head_commit.message, '[skip blog deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Verify the deployed source
        working-directory: .
        run: |
          test "$(git rev-parse HEAD^)" = f81cda17ced81e3f2afa2fe650950b0977f0e2a5
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/deploy-blog-once.yml
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp run build
      - name: Redeploy only the existing direct blog Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: "1c5b61e0bfd3a45c3b3c10207fb6136d"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: irreversible
        run: |
          test ! -e .cloudflare/output/v0/workers/default/assets/icon.svg
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token } = process.env;
          assert(token, "The repository Cloudflare secret is unavailable");
          const cache = { binding: "ISR_CACHE", id: "a31ed920b7464ba8ad0d478cfde962e9" };
          const config = JSON.parse(readFileSync(".void-wrangler.jsonc", "utf8"));
          assert.deepEqual(config, JSON.parse(readFileSync("void.lock.json", "utf8")).resolved);
          assert.deepEqual(config, {
            name: "blog",
            account_id: account,
            workers_dev: true,
            preview_urls: false,
            routes: [],
            kv_namespaces: [cache],
          });
          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            });
            assert(response.ok, `Cloudflare read of ${path} failed: HTTP ${response.status}`);
            const payload = await response.json();
            assert(payload.success, `Cloudflare rejected ${path}`);
            return payload.result;
          }
          async function active(name) {
            const { deployments } = await get(`${name}/deployments`);
            const deployment = deployments.toSorted((a, b) => Date.parse(b.created_on) - Date.parse(a.created_on))[0];
            assert.equal(deployment?.versions?.length, 1, `Expected one active version for ${name}`);
            assert.equal(deployment.versions[0].percentage, 100);
            return deployment.versions[0].version_id;
          }
          async function verifyDirectBlog(version) {
            const { resources } = await get(`blog/versions/${version}`);
            assert(!resources.bindings.some(({ type }) => type === "service"), "Unexpected forwarding binding");
            assert(resources.bindings.some(({ type, name, namespace_id }) =>
              type === "kv_namespace" && name === cache.binding && namespace_id === cache.id));
            const subdomain = await get("blog/subdomain");
            assert.equal(subdomain.enabled, true);
            assert.equal(subdomain.previews_enabled, false);
          }
          const [blog, website, old] = await Promise.all(["blog", "irreversible", "irreversible-blog"].map(active));
          await verifyDirectBlog(blog);
          execFileSync("vp", ["exec", "void", "deploy", "--platform", "cloudflare"], { stdio: "inherit" });
          const [currentBlog, currentWebsite, currentOld] = await Promise.all(["blog", "irreversible", "irreversible-blog"].map(active));
          assert.notEqual(currentBlog, blog, "Expected a new blog version");
          assert.equal(currentWebsite, website);
          assert.equal(currentOld, old);
          await verifyDirectBlog(currentBlog);
          console.log(`Updated only the direct blog Worker: ${currentBlog}`);
          NODE
