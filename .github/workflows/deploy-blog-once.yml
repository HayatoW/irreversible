name: Deploy standalone blog

on:
  push:
    branches: [blog]
    paths: [.github/workflows/deploy-blog-once.yml]

permissions:
  contents: read

concurrency: irreversible-blog-deploy

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp run codegen
      - name: Verify the isolated Cloudflare target
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("The repository CLOUDFLARE_API_TOKEN secret is unavailable.");

          async function list(path, label) {
            const items = [];
            for (let page = 1; ; page++) {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}?page=${page}`, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json();
              if (!response.ok || !body.success || !Array.isArray(body.result)) {
                const codes = (body.errors ?? []).map(({ code }) => code).filter(Number.isInteger);
                throw new Error(`${label} failed: HTTP ${response.status}, Cloudflare codes: ${codes.join(", ")}`);
              }
              items.push(...body.result);
              if (page >= (body.result_info?.total_pages ?? 1)) return items;
            }
          }

          const accounts = await list("/accounts", "Account discovery");
          if (accounts.length !== 1 || !/^[0-9a-f]{32}$/.test(accounts[0].id)) {
            throw new Error("Expected exactly one accessible Cloudflare account.");
          }
          const { id } = accounts[0];
          const { resolved: lock } = JSON.parse(readFileSync("void.lock.json", "utf8"));
          if (lock.account_id !== id || lock.name !== "irreversible-blog" || lock.workers_dev !== true) {
            throw new Error("The blog deployment lock does not match the Cloudflare target.");
          }
          const workers = await list(`/accounts/${id}/workers/scripts`, "Workers Scripts list");
          const names = workers.map(({ id }) => id);
          if (!names.includes("irreversible") || names.includes("irreversible-blog")) {
            throw new Error("Expected the existing site Worker and no existing irreversible-blog Worker.");
          }
          const databases = await list(`/accounts/${id}/d1/database`, "D1 database list");
          const expected = lock.d1_databases?.[0];
          const matches = databases.filter(({ name }) => name === "irreversible-blog-db");
          if (lock.d1_databases?.length !== 1 || expected?.binding !== "DB" ||
              expected.database_name !== "irreversible-blog-db" || matches.length !== 1 ||
              matches[0].uuid !== expected.database_id) {
            throw new Error("The existing D1 database does not match the blog deployment lock.");
          }
          const namespaces = await list(`/accounts/${id}/storage/kv/namespaces`, "Workers KV namespace list");
          if (namespaces.some(({ title }) => title === "irreversible-blog-isr-cache")) {
            throw new Error("An existing blog ISR cache must be verified before it can be reused.");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `account-id=${id}\n`);
          NODE
      - name: Publish the standalone Worker through Void
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.target.outputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec void deploy --platform cloudflare
      - name: Save the generated deployment lock
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blog-void-lock
          path: apps/blog/void.lock.json
          retention-days: 7
