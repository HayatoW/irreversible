name: Deploy standalone blog

on:
  push:
    branches: [devin/deploy-review-029613c]
    paths: [.github/workflows/deploy-blog-once.yml]

permissions:
  contents: read

concurrency: irreversible-blog-deploy

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
        working-directory: .
      - run: vp run build
      - name: Verify the isolated Cloudflare target
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";

          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("The repository CLOUDFLARE_API_TOKEN secret is unavailable.");
          const lock = JSON.parse(readFileSync("void.lock.json", "utf8")).resolved;
          const config = JSON.parse(readFileSync(".void-wrangler.jsonc", "utf8"));
          assert.deepEqual(config, lock);
          assert.equal(config.name, "irreversible-blog");
          assert.equal(config.workers_dev, true);
          assert.match(config.account_id, /^[0-9a-f]{32}$/);
          assert.equal(config.d1_databases?.length ?? 0, 0);
          assert.equal(config.durable_objects?.bindings?.length ?? 0, 0);

          async function list(path, label) {
            const items = [];
            for (let page = 1; ; page++) {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${config.account_id}${path}?page=${page}`, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json();
              if (!response.ok || !body.success || !Array.isArray(body.result)) {
                const codes = (body.errors ?? []).map(({ code }) => code).filter(Number.isInteger);
                throw new Error(`${label} failed: HTTP ${response.status}, Cloudflare codes: ${codes.join(", ")}`);
              }
              items.push(...body.result);
              if (page >= (body.result_info?.total_pages ?? 1)) return items;
            }
          }

          const workers = await list("/workers/scripts", "Workers Scripts list");
          const names = new Set(workers.map(({ id }) => id));
          for (const name of ["irreversible", "irreversible-blog", "blog"]) {
            assert(names.has(name), `Missing expected Worker: ${name}`);
          }
          const target = workers.find(({ id }) => id === config.name);
          console.log("Blog migration tag:", target.migration_tag ?? "(not reported)");
          const namespaces = await list("/storage/kv/namespaces", "Workers KV namespace list");
          const cache = config.kv_namespaces?.find(({ binding }) => binding === "ISR_CACHE");
          assert(cache && namespaces.some(({ id }) => id === cache.id), "Missing locked ISR cache");
          appendFileSync(process.env.GITHUB_OUTPUT, `account-id=${config.account_id}\n`);
          NODE
      - name: Publish only the standalone Worker through Void
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.target.outputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec void deploy --platform cloudflare --atomic
      - name: Save the generated deployment lock
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blog-void-lock
          path: apps/blog/void.lock.json
          retention-days: 7
