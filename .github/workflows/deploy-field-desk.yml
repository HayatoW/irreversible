name: Deploy Field Desk

on:
  push:
    branches: [main]
    paths:
      - apps/field-desk/**
      - .github/workflows/deploy-field-desk.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency: field-desk-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Build Field Desk
        run: vp run field-desk#build
      - name: Deploy Field Desk to Cloudflare
        working-directory: apps/field-desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: irreversible
        run: vp run deploy --dir dist --spa
