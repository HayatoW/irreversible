name: Rename the existing Field Desk Worker

on:
  push:
    branches: [devin/1795270660-field-desk-publish]
    paths: [.github/workflows/rename-field-desk-once.yml]

permissions:
  contents: read

concurrency: field-desk-deploy

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rename the Worker by its immutable ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const oldName = "irreversible-field-desk";
          const newName = "field-desk";
          const config = readFileSync("apps/field-desk/void.config.ts", "utf8");
          const account = config.match(/account_id: "([0-9a-f]{32})"/)?.[1];
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token || !config.includes(`name: "${newName}"`)) {
            throw new Error("Missing the configured Field Desk account, target name or token.");
          }

          async function cloudflare(path, options = {}) {
            const { method = "GET", body, allowMissing = false } = options;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
              method,
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(15000),
            });
            const payload = await response.json();
            if (allowMissing && response.status === 404) return null;
            if (!response.ok || !payload.success) {
              const errors = payload.errors?.map(({ code, message }) => `${code} ${message}`).join(", ");
              throw new Error(`${method} ${path} failed (HTTP ${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const accountSubdomain = await cloudflare("/workers/subdomain");
          if (accountSubdomain.subdomain !== "irreversible") throw new Error("Unexpected account subdomain.");

          const scripts = "/workers/workers";
          const original = await cloudflare(`${scripts}/${oldName}`);
          if (original.name !== oldName || !original.id || !original.subdomain?.enabled) {
            throw new Error("The expected public Field Desk Worker was not found.");
          }
          const target = await cloudflare(`${scripts}/${newName}`, { allowMissing: true });
          if (target) throw new Error("The target Worker name is already used.");

          const renamed = await cloudflare(`${scripts}/${original.id}`, {
            method: "PATCH",
            body: { name: newName },
          });
          if (renamed.name !== newName || renamed.id !== original.id || !renamed.subdomain?.enabled) {
            throw new Error("The Worker name, ID or public route did not match after the rename.");
          }
          console.log(`Renamed ${oldName} to ${newName}; Worker ID and deployed version preserved.`);
          NODE
