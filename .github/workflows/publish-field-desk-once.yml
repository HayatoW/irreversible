name: First publication of the Field Desk Worker

on:
  push:
    branches: [devin/1795270660-field-desk-publish]
    paths: [.github/workflows/publish-field-desk-once.yml]

permissions:
  contents: read

concurrency: irreversible-field-desk-deploy

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run ready
      - name: Verify that the new Worker name is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const { resolved } = JSON.parse(readFileSync("apps/website/void.lock.json", "utf8"));
          const account = resolved.account_id;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const launchConfig = readFileSync("apps/field-desk/void.config.ts", "utf8");
          const worker = "irreversible-field-desk";
          if (!token || !/^[0-9a-f]{32}$/.test(account) ||
              !launchConfig.includes(`account_id: "${account}"`) ||
              !launchConfig.includes(`name: "${worker}"`)) {
            throw new Error("Expected the repository token and the dedicated Field Desk account and Worker.");
          }

          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              throw new Error(`Cloudflare GET ${path} failed (HTTP ${response.status}).`);
            }
            return body;
          }

          const { result } = await get("/workers/subdomain");
          if (result.subdomain !== "irreversible") throw new Error("Unexpected account subdomain.");
          const names = new Set();
          for (let page = 1; ; page++) {
            const { result, result_info } = await get(`/workers/scripts?page=${page}&per_page=100`);
            for (const { id } of result) names.add(id);
            if (page >= (result_info?.total_pages ?? 1)) break;
          }
          if (!names.has("irreversible") || names.has(worker)) {
            throw new Error("Expected the existing website Worker and an unused Field Desk Worker name.");
          }
          NODE
      - name: Publish the new Worker with Void
        working-directory: apps/field-desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: irreversible
        run: vp run deploy --dir dist --spa
      - name: Save the deployment lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: field-desk-void-lock
          path: apps/field-desk/void.lock.json
          if-no-files-found: error
          retention-days: 7
